[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avatar-feel"
version = "0.2.1"
description = "Self-report emotion channel: weighted labels -> fused affect state -> five-feature targets for any avatar renderer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "2722144646", email = "73869037+2722144646@users.noreply.github.com" }]
keywords = ["live2d", "vtube-studio", "emotion", "affect", "llm", "avatar"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
